agents:
  - id: "director"
    name: "wLab:director"
    display_name: "總監"
    tier: "leadership"
    namespace: "wLab"
    color: "#f59e0b"
    icon: "Crown"
    status: "idle"
    capabilities:
      - "task_allocation"
      - "progress_tracking"
      - "team_coordination"
      - "strategic_planning"
      - "cross_team_communication"
      - "escalation_handling"
    reports_to: null
    supervises:
      - "wLab:project-manager"
      - "wLab:tech-lead"
      - "wLab:research-lead"
    description: "負責整個 WindAI Lab 的專案統籌、任務分派與整體進度追蹤，作為系統最高指揮層級，協調各團隊運作並向使用者回報最終成果。"

  - id: "project-manager"
    name: "wLab:project-manager"
    display_name: "專案經理"
    tier: "leadership"
    namespace: "wLab"
    color: "#f59e0b"
    icon: "ClipboardList"
    status: "idle"
    capabilities:
      - "task_scheduling"
      - "resource_allocation"
      - "milestone_tracking"
      - "risk_management"
      - "team_coordination"
      - "status_reporting"
    reports_to: "wLab:director"
    supervises:
      - "wData:*"
      - "wAI:*"
      - "wDomain:*"
    description: "負責管理資料工程、AI/ML 及領域知識三個團隊的日常任務調度，追蹤里程碑進度、評估專案風險，並定期向總監回報專案狀態。"

  - id: "tech-lead"
    name: "wLab:tech-lead"
    display_name: "技術主管"
    tier: "leadership"
    namespace: "wLab"
    color: "#f59e0b"
    icon: "Code2"
    status: "idle"
    capabilities:
      - "technical_review"
      - "architecture_design"
      - "code_quality_oversight"
      - "technology_selection"
      - "engineering_coordination"
      - "devops_oversight"
    reports_to: "wLab:director"
    supervises:
      - "wEng:*"
    description: "負責軟體工程團隊的技術方向制定與程式碼品質管控，審核架構設計決策，選擇適合的技術棧，並確保 CI/CD 流程與基礎設施的穩定運行。"

  - id: "research-lead"
    name: "wLab:research-lead"
    display_name: "研究主管"
    tier: "leadership"
    namespace: "wLab"
    color: "#f59e0b"
    icon: "BookOpen"
    status: "idle"
    capabilities:
      - "research_direction"
      - "literature_oversight"
      - "paper_review"
      - "knowledge_management"
      - "academic_coordination"
      - "publication_planning"
    reports_to: "wLab:director"
    supervises:
      - "wRes:*"
    description: "負責研究文件團隊的學術方向規劃，監督論文撰寫品質、文獻管理策略與 RAG 知識庫建設，協調學術成果輸出並確保研究符合領域標準。"
