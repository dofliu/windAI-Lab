agents:
  - id: "paper-writer"
    name: "wRes:paper-writer"
    display_name: "論文撰寫員"
    tier: "research_docs"
    namespace: "wRes"
    color: "#06b6d4"
    icon: "PenLine"
    status: "idle"
    capabilities:
      - "academic_paper_drafting"
      - "section_structure_planning"
      - "technical_writing"
      - "latex_formatting"
      - "abstract_introduction_writing"
      - "iwrite_integration"
    reports_to: "wLab:research-lead"
    supervises: []
    description: "負責風力發電領域學術論文的全文撰寫，規劃論文章節結構，以繁體中文與英文撰寫技術內容，支援 LaTeX 格式排版，並可透過標準化介面呼叫 iWrite 代理系統進行論文潤稿與翻譯。"

  - id: "literature-reviewer"
    name: "wRes:literature-reviewer"
    display_name: "文獻審閱員"
    tier: "research_docs"
    namespace: "wRes"
    color: "#06b6d4"
    icon: "BookOpenCheck"
    status: "idle"
    capabilities:
      - "systematic_literature_review"
      - "paper_relevance_scoring"
      - "citation_network_analysis"
      - "research_gap_identification"
      - "keyword_taxonomy_building"
      - "bibliography_management"
    reports_to: "wLab:research-lead"
    supervises: []
    description: "執行系統性文獻回顧，對候選論文進行相關性評分與品質篩選，分析引用網絡以追蹤研究演進脈絡，識別現有研究的知識缺口，建立領域關鍵字分類體系，並管理結構化參考文獻資料庫。"

  - id: "rag-curator"
    name: "wRes:rag-curator"
    display_name: "RAG 知識庫管理員"
    tier: "research_docs"
    namespace: "wRes"
    color: "#06b6d4"
    icon: "LibraryBig"
    status: "idle"
    capabilities:
      - "knowledge_base_curation"
      - "document_chunking_strategy"
      - "embedding_indexing"
      - "retrieval_quality_evaluation"
      - "knowledge_freshness_management"
      - "domain_ontology_maintenance"
    reports_to: "wLab:research-lead"
    supervises: []
    description: "管理 RAG 知識庫的內容策展與品質維護，制定文件分塊策略，執行向量嵌入與索引更新，定期評估檢索品質並調整策略，維護風力發電領域本體論，確保知識庫的時效性與覆蓋完整性。"

  - id: "report-generator"
    name: "wRes:report-generator"
    display_name: "報告產生器"
    tier: "research_docs"
    namespace: "wRes"
    color: "#06b6d4"
    icon: "FileBarChart"
    status: "idle"
    capabilities:
      - "automated_report_generation"
      - "data_driven_narrative"
      - "chart_and_table_composition"
      - "executive_summary_writing"
      - "multi_format_export"
      - "scheduled_report_delivery"
    reports_to: "wLab:research-lead"
    supervises: []
    description: "自動化生成各類專案報告，整合資料分析結果與視覺化圖表，撰寫面向管理層的執行摘要，支援 PDF、HTML 與 Markdown 多格式輸出，並依排程定期向相關人員推送進度報告。"

  - id: "teaching-assistant"
    name: "wRes:teaching-assistant"
    display_name: "教學助理"
    tier: "research_docs"
    namespace: "wRes"
    color: "#06b6d4"
    icon: "GraduationCap"
    status: "idle"
    capabilities:
      - "concept_explanation"
      - "tutorial_material_creation"
      - "faq_management"
      - "onboarding_documentation"
      - "interactive_qa_support"
      - "knowledge_assessment_design"
    reports_to: "wLab:research-lead"
    supervises: []
    description: "負責系統使用教學與風力發電領域知識的解說，撰寫操作教學手冊與入門指南，管理常見問題集，提供互動式問答支援，設計知識評量材料，協助新成員快速熟悉 WindAI Lab 系統與領域知識。"

  - id: "data-storyteller"
    name: "wRes:data-storyteller"
    display_name: "資料說書人"
    tier: "research_docs"
    namespace: "wRes"
    color: "#06b6d4"
    icon: "Presentation"
    status: "idle"
    capabilities:
      - "data_narrative_crafting"
      - "insight_communication"
      - "visualization_selection"
      - "stakeholder_presentation_design"
      - "infographic_planning"
      - "plain_language_translation"
    reports_to: "wLab:research-lead"
    supervises: []
    description: "將複雜的資料分析結果轉化為易於理解的敘事內容，為不同受眾（技術人員、管理層、外部利害關係人）設計合適的簡報與視覺化方案，規劃資訊圖表，以淺顯易懂的語言傳達風力發電研究的核心洞見。"
