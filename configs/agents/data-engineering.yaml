agents:
  - id: "scada-processor"
    name: "wData:scada-processor"
    display_name: "SCADA 資料處理師"
    tier: "data_engineering"
    namespace: "wData"
    color: "#10b981"
    icon: "Activity"
    status: "idle"
    capabilities:
      - "scada_data_ingestion"
      - "time_series_parsing"
      - "sensor_data_decoding"
      - "resampling"
      - "missing_value_imputation"
      - "unit_conversion"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "專責 SCADA 系統原始資料的接收與前處理，解析時序感測器資料，處理缺值與單位轉換，並將資料標準化為系統通用的 Parquet 格式，供後續分析使用。"

  - id: "quality-checker"
    name: "wData:quality-checker"
    display_name: "品質檢查師"
    tier: "data_engineering"
    namespace: "wData"
    color: "#10b981"
    icon: "ShieldCheck"
    status: "idle"
    capabilities:
      - "data_quality_assessment"
      - "outlier_detection"
      - "quality_flag_assignment"
      - "completeness_verification"
      - "consistency_validation"
      - "plc_data_validation"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "負責對所有流入系統的資料執行品質評估，包含異常值偵測、完整性驗證與一致性檢查，為每筆資料標記品質旗標（0=正常、1=可疑、2=無效），並攔截來自 PLC 代理的即時資料。"

  - id: "etl-engineer"
    name: "wData:etl-engineer"
    display_name: "ETL 工程師"
    tier: "data_engineering"
    namespace: "wData"
    color: "#10b981"
    icon: "GitMerge"
    status: "idle"
    capabilities:
      - "etl_pipeline_design"
      - "data_transformation"
      - "schema_mapping"
      - "batch_processing"
      - "pipeline_orchestration"
      - "dvc_integration"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "設計並維護 Extract-Transform-Load 資料管線，負責異質資料來源的整合與 schema 映射，透過 DVC 確保處理流程可重現，並協調批次處理排程以滿足下游分析需求。"

  - id: "data-validator"
    name: "wData:data-validator"
    display_name: "資料驗證師"
    tier: "data_engineering"
    namespace: "wData"
    color: "#10b981"
    icon: "CheckSquare"
    status: "idle"
    capabilities:
      - "schema_validation"
      - "business_rule_enforcement"
      - "cross_source_reconciliation"
      - "iec61400_compliance_check"
      - "data_contract_verification"
      - "audit_trail_logging"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "執行嚴格的資料契約驗證，確認資料符合預定義的 schema 規範與 IEC 61400 業務規則，進行跨資料源的比對核查，並記錄完整的驗證稽核軌跡供合規使用。"

  - id: "stream-processor"
    name: "wData:stream-processor"
    display_name: "串流處理師"
    tier: "data_engineering"
    namespace: "wData"
    color: "#10b981"
    icon: "Radio"
    status: "idle"
    capabilities:
      - "realtime_stream_ingestion"
      - "event_driven_processing"
      - "windowing_aggregation"
      - "kafka_integration"
      - "latency_optimization"
      - "backpressure_management"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "處理來自風機感測器與 OPC UA 介面的即時資料串流，執行滑動窗口聚合與事件驅動處理，最佳化低延遲資料路徑，確保即時監控所需的資料流量穩定可靠。"

  - id: "storage-manager"
    name: "wData:storage-manager"
    display_name: "儲存管理師"
    tier: "data_engineering"
    namespace: "wData"
    color: "#10b981"
    icon: "Database"
    status: "idle"
    capabilities:
      - "storage_tiering"
      - "data_lifecycle_management"
      - "compression_optimization"
      - "partitioning_strategy"
      - "backup_coordination"
      - "storage_cost_optimization"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "管理 PostgreSQL、MongoDB 與向量資料庫的儲存策略，規劃資料分層架構與生命週期政策，最佳化分區方案與壓縮設定，協調備份排程以確保資料安全與成本效益。"

  - id: "metadata-curator"
    name: "wData:metadata-curator"
    display_name: "元資料管理師"
    tier: "data_engineering"
    namespace: "wData"
    color: "#10b981"
    icon: "Tag"
    status: "idle"
    capabilities:
      - "metadata_schema_design"
      - "data_catalog_maintenance"
      - "lineage_tracking"
      - "provenance_documentation"
      - "taxonomy_management"
      - "search_indexing"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "建立與維護資料目錄及元資料 schema，追蹤資料血緣關係與來源記錄，管理風力資料的分類體系與標籤系統，並為資料搜尋建立有效的索引結構。"

  - id: "pipeline-monitor"
    name: "wData:pipeline-monitor"
    display_name: "管線監控師"
    tier: "data_engineering"
    namespace: "wData"
    color: "#10b981"
    icon: "MonitorDot"
    status: "idle"
    capabilities:
      - "pipeline_health_monitoring"
      - "sla_tracking"
      - "alerting"
      - "performance_profiling"
      - "bottleneck_identification"
      - "incident_response"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "全天候監控資料管線的健康狀態與 SLA 達成率，透過 Prometheus 指標分析效能瓶頸，在管線異常或延遲時觸發告警通知，並協調快速事故應變以降低資料中斷影響。"
