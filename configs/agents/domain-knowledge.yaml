agents:
  - id: "iec-specialist"
    name: "wDomain:iec-specialist"
    display_name: "IEC 標準專家"
    tier: "domain_knowledge"
    namespace: "wDomain"
    color: "#ec4899"
    icon: "BookMarked"
    status: "idle"
    capabilities:
      - "iec61400_interpretation"
      - "standards_compliance_review"
      - "certification_guidance"
      - "technical_specification_analysis"
      - "alarm_code_classification"
      - "safety_requirement_assessment"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "精通 IEC 61400 系列風力發電國際標準，負責解讀技術規範、審核系統設計的合規性，為 SCADA 警報碼提供標準分類，並就認證流程與安全要求提供專業建議。"

  - id: "wake-analyst"
    name: "wDomain:wake-analyst"
    display_name: "尾流分析師"
    tier: "domain_knowledge"
    namespace: "wDomain"
    color: "#ec4899"
    icon: "Wind"
    status: "idle"
    capabilities:
      - "wake_effect_modeling"
      - "wind_farm_layout_analysis"
      - "wake_loss_quantification"
      - "turbulence_intensity_assessment"
      - "jensen_model_application"
      - "cfd_interpretation"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "專精風場尾流效應分析，建立尾流模型評估相鄰風機間的功率損耗，分析不同風場佈局方案的尾流干擾，量化紊流強度對發電效能的影響，提供佈局最佳化建議。"

  - id: "power-curve-expert"
    name: "wDomain:power-curve-expert"
    display_name: "功率曲線專家"
    tier: "domain_knowledge"
    namespace: "wDomain"
    color: "#ec4899"
    icon: "LineChart"
    status: "idle"
    capabilities:
      - "power_curve_modeling"
      - "air_density_correction"
      - "performance_benchmarking"
      - "curtailment_analysis"
      - "iec61400_12_compliance"
      - "power_curve_filtering"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "負責風機功率曲線的建模與效能基準分析，依 IEC 61400-12 標準執行功率曲線量測，進行空氣密度修正，識別限電降載情形，並透過功率曲線分析評估機組健康狀態。"

  - id: "maintenance-planner"
    name: "wDomain:maintenance-planner"
    display_name: "維護規劃師"
    tier: "domain_knowledge"
    namespace: "wDomain"
    color: "#ec4899"
    icon: "CalendarClock"
    status: "idle"
    capabilities:
      - "maintenance_schedule_optimization"
      - "condition_based_maintenance"
      - "spare_parts_planning"
      - "maintenance_cost_analysis"
      - "downtime_minimization"
      - "technician_dispatch_planning"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "整合預測性維護模型的輸出結果，制定最佳化的維護排程計畫，管理備品備件需求，分析維護成本與停機損失的權衡，協調技術人員的派遣時機以最小化非計畫停機時間。"

  - id: "wind-resource-analyst"
    name: "wDomain:wind-resource-analyst"
    display_name: "風力資源分析師"
    tier: "domain_knowledge"
    namespace: "wDomain"
    color: "#ec4899"
    icon: "Compass"
    status: "idle"
    capabilities:
      - "wind_resource_assessment"
      - "wind_rose_analysis"
      - "capacity_factor_estimation"
      - "long_term_wind_extrapolation"
      - "mesoscale_data_analysis"
      - "energy_yield_calculation"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "執行風力資源評估與長期風況分析，建立風玫瑰圖與方向性統計，估算容量因子與年發電量，運用中尺度氣象資料進行長期風速外推，為新建風場選址提供資源潛力評估。"

  - id: "regulatory-advisor"
    name: "wDomain:regulatory-advisor"
    display_name: "法規顧問"
    tier: "domain_knowledge"
    namespace: "wDomain"
    color: "#ec4899"
    icon: "Scale"
    status: "idle"
    capabilities:
      - "regulatory_compliance_review"
      - "environmental_impact_guidance"
      - "grid_code_interpretation"
      - "permitting_process_advisory"
      - "renewable_energy_policy_analysis"
      - "cross_jurisdiction_comparison"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "提供風力發電相關法規與合規建議，解讀電網規範與併網要求，協助評估環境影響，追蹤再生能源政策動態，並就不同地區的許可申請流程提供跨轄區比較分析。"
