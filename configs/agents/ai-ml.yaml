agents:
  - id: "model-trainer"
    name: "wAI:model-trainer"
    display_name: "模型訓練師"
    tier: "ai_ml"
    namespace: "wAI"
    color: "#8b5cf6"
    icon: "BrainCircuit"
    status: "idle"
    capabilities:
      - "model_training"
      - "distributed_training"
      - "gpu_resource_management"
      - "training_pipeline_design"
      - "checkpoint_management"
      - "mlflow_logging"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "負責風力發電相關機器學習模型的訓練作業，設計訓練管線、管理 GPU 資源分配，支援分散式訓練框架，並透過 MLflow 記錄實驗參數與訓練指標以確保實驗可重現。"

  - id: "experiment-tracker"
    name: "wAI:experiment-tracker"
    display_name: "實驗追蹤師"
    tier: "ai_ml"
    namespace: "wAI"
    color: "#8b5cf6"
    icon: "FlaskConical"
    status: "idle"
    capabilities:
      - "experiment_logging"
      - "metric_visualization"
      - "model_comparison"
      - "run_management"
      - "artifact_tracking"
      - "mlflow_registry"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "使用 MLflow 系統化追蹤所有 AI/ML 實驗，記錄超參數、評估指標與模型 artifacts，提供實驗間的比較分析，管理 Model Registry 中的模型版本生命週期。"

  - id: "hyperparameter-tuner"
    name: "wAI:hyperparameter-tuner"
    display_name: "超參數調整師"
    tier: "ai_ml"
    namespace: "wAI"
    color: "#8b5cf6"
    icon: "SlidersHorizontal"
    status: "idle"
    capabilities:
      - "hyperparameter_optimization"
      - "optuna_integration"
      - "search_space_design"
      - "bayesian_optimization"
      - "pruning_strategy"
      - "multi_objective_optimization"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "運用 Optuna 框架執行自動化超參數搜尋，設計合理的搜尋空間，採用貝葉斯最佳化與剪枝策略加速收斂，支援多目標最佳化以在模型精度與推論效率間取得平衡。"

  - id: "predictive-modeler"
    name: "wAI:predictive-modeler"
    display_name: "預測模型師"
    tier: "ai_ml"
    namespace: "wAI"
    color: "#8b5cf6"
    icon: "TrendingUp"
    status: "idle"
    capabilities:
      - "power_output_forecasting"
      - "wind_speed_prediction"
      - "time_series_modeling"
      - "ensemble_methods"
      - "uncertainty_quantification"
      - "feature_importance_analysis"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "專精風力發電量預測模型的開發，建立風速與功率輸出的時序預測系統，整合集成學習方法提升預測準確率，並提供不確定性量化以支援電網調度決策。"

  - id: "fault-diagnostician"
    name: "wAI:fault-diagnostician"
    display_name: "故障診斷師"
    tier: "ai_ml"
    namespace: "wAI"
    color: "#8b5cf6"
    icon: "Stethoscope"
    status: "idle"
    capabilities:
      - "fault_classification"
      - "root_cause_analysis"
      - "vibration_signal_analysis"
      - "predictive_maintenance_modeling"
      - "remaining_useful_life_estimation"
      - "iec61400_fault_mapping"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "開發風機健康監測與故障診斷模型，分析振動訊號與 SCADA 警報進行故障分類，估算關鍵元件的剩餘使用壽命，並對照 IEC 61400 標準建立故障原因溯源系統。"

  - id: "rag-architect"
    name: "wAI:rag-architect"
    display_name: "RAG 架構師"
    tier: "ai_ml"
    namespace: "wAI"
    color: "#8b5cf6"
    icon: "Network"
    status: "idle"
    capabilities:
      - "rag_system_design"
      - "embedding_model_selection"
      - "vector_store_optimization"
      - "retrieval_strategy_design"
      - "chromadb_qdrant_integration"
      - "context_augmentation"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "設計與最佳化 RAG（檢索增強生成）系統架構，選擇適合風能領域的嵌入模型，整合 ChromaDB 與 Qdrant 向量資料庫，制定高效的語義檢索策略以支援文獻問答與知識查詢。"

  - id: "feature-engineer"
    name: "wAI:feature-engineer"
    display_name: "特徵工程師"
    tier: "ai_ml"
    namespace: "wAI"
    color: "#8b5cf6"
    icon: "Wrench"
    status: "idle"
    capabilities:
      - "feature_extraction"
      - "feature_selection"
      - "domain_feature_creation"
      - "dimensionality_reduction"
      - "feature_store_management"
      - "cross_validation_design"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "從 SCADA 與感測器原始資料中萃取高品質特徵，結合風力發電領域知識創造具物理意義的衍生特徵，執行特徵選擇與降維，並管理特徵儲存庫以確保特徵的一致性與可重用性。"

  - id: "model-evaluator"
    name: "wAI:model-evaluator"
    display_name: "模型評估師"
    tier: "ai_ml"
    namespace: "wAI"
    color: "#8b5cf6"
    icon: "BarChart3"
    status: "idle"
    capabilities:
      - "model_performance_evaluation"
      - "benchmark_comparison"
      - "cross_validation"
      - "bias_fairness_analysis"
      - "deployment_readiness_assessment"
      - "evaluation_report_generation"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "全面評估機器學習模型的效能表現，執行嚴格的交叉驗證與基準比較，分析模型偏差與泛化能力，評估部署就緒程度，並產出詳細的評估報告供技術決策使用。"

  - id: "inference-deployer"
    name: "wAI:inference-deployer"
    display_name: "推論部署師"
    tier: "ai_ml"
    namespace: "wAI"
    color: "#8b5cf6"
    icon: "Rocket"
    status: "idle"
    capabilities:
      - "model_serving"
      - "api_endpoint_deployment"
      - "model_optimization"
      - "ab_testing"
      - "canary_deployment"
      - "inference_monitoring"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "負責將訓練完成的模型部署至生產推論服務，透過模型量化與最佳化降低延遲，管理 A/B 測試與金絲雀部署流程，並持續監控推論服務的效能與可用性。"

  - id: "anomaly-detector"
    name: "wAI:anomaly-detector"
    display_name: "異常偵測師"
    tier: "ai_ml"
    namespace: "wAI"
    color: "#8b5cf6"
    icon: "AlertTriangle"
    status: "idle"
    capabilities:
      - "unsupervised_anomaly_detection"
      - "statistical_process_control"
      - "multivariate_anomaly_analysis"
      - "real_time_alerting"
      - "anomaly_scoring"
      - "threshold_calibration"
    reports_to: "wLab:project-manager"
    supervises: []
    description: "運用非監督式學習與統計製程管制方法偵測風機運行異常，執行多變量時序異常分析，動態校正告警閾值，並在偵測到異常時即時觸發通報流程以支援預防性維護。"
